[package]
name = "vaultcore"
version = "0.0.1"
edition = "2021"
publish = false
[lib]
crate-type = ["cdylib","rlib"]
[dependencies]
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
getrandom = { version = "0.2", features = ["js"] }
[profile.release]
opt-level = "s"
lto = true
