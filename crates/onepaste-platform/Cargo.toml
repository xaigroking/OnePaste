[package]
name = "onepaste-platform"
description = "Platform adapters: clipboard monitoring and access, system secure storage, wake-from-sleep and network change events"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
thiserror = "1"

[dev-dependencies]
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
png = "0.18"
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
keyring = { version = "3", default-features = false, features = ["apple-native"] }
