[package]
name = "onepaste-client"
description = "OnePaste native client layer: HTTPS with certificate pinning, SQLite storage and the change-notification listener"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Test-only fault injection (never enabled in release builds)
fault-injection = []

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies]
onepaste-core = { path = "../onepaste-core" }
onepaste-sync = { path = "../onepaste-sync" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.41", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "1"
