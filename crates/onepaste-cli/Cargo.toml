[package]
name = "onepaste-cli"
description = "OnePaste command line client"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "onepaste"
path = "src/main.rs"

[features]
# Test-only fault injection (never enabled in release builds)
fault-injection = ["onepaste-client/fault-injection"]

[dependencies]
onepaste-client = { path = "../onepaste-client" }
onepaste-core = { path = "../onepaste-core" }
onepaste-sync = { path = "../onepaste-sync" }
clap = { version = "4", features = ["derive", "env"] }
rpassword = "7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
serde_json = "1"
base64 = "0.22"
