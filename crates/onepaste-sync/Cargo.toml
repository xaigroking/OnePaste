[package]
name = "onepaste-sync"
description = "OnePaste sync engine: decides which requests to send and how local state changes. It performs no IO."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
onepaste-core = { path = "../onepaste-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "1"
zeroize = { version = "1", features = ["derive"] }
