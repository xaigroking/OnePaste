[package]
name = "onepaste-desktop"
version = "0.0.1"
description = "OnePaste 桌面验证程序"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
onepaste-platform = { path = "../../../crates/onepaste-platform" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
