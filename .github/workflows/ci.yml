name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 安装 Rust 与 wasm32 目标
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - name: 仓库卡口与测试
        run: CI=true bash scripts/check.sh
      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 接口规格 lint
        run: npx --yes @redocly/cli@2.57.0 lint api/openapi.yaml

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: 工作区测试
        run: cargo test --workspace
      - name: vaultcore 测试
        working-directory: spikes/vaultcore
        run: cargo test --release
