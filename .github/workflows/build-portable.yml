name: build-portable

# Builds the portable desktop packages: a zip with OnePaste.exe for Windows and a universal
# OnePaste.app zip for macOS. Each zip also holds READ-ME-FIRST.txt (copied from packaging/) with the steps
# to allow the app to open the first time. Nothing is installed and no administrator rights are needed.
#
# macOS signing is optional and needs no code change:
#   * Without the repository secrets below the app is signed ad hoc and not notarized (the current state).
#   * To switch to a Developer ID signature with notarization, add all of these repository secrets
#     (Settings -> Secrets and variables -> Actions) and push the next release tag:
#       APPLE_CERTIFICATE            the "Developer ID Application" certificate exported as .p12, base64 encoded
#       APPLE_CERTIFICATE_PASSWORD   the password chosen when exporting the .p12
#       APPLE_SIGNING_IDENTITY       for example "Developer ID Application: Your Name (TEAMID)"
#       APPLE_ID                     the Apple ID used for notarization
#       APPLE_PASSWORD               an app-specific password of that Apple ID
#       APPLE_TEAM_ID                the 10-character Apple team id
#   * Missing secrets never fail the build. If APPLE_CERTIFICATE is set but another secret is missing, or if
#     signing or notarization fails, the build fails: it never falls back to ad hoc signing silently.
#   * Only the release workflow passes the secrets on; builds for pull requests never see them.
on:
  workflow_call:
    inputs:
      label:
        description: Label used in the file names, such as a release tag
        type: string
        required: true
      build_tag:
        description: Build tag shown in the diagnostics text (empty for ordinary CI builds)
        type: string
        required: false
        default: ""
      retention_days:
        description: How long the built zip files are kept
        type: number
        required: false
        default: 14
    secrets:
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false

permissions:
  contents: read

jobs:
  windows-x64:
    name: windows-x64
    runs-on: windows-latest
    env:
      LABEL: ${{ inputs.label }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          rustup default stable
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build the executable (no installer)
        working-directory: apps/desktop
        env:
          ONEPASTE_BUILD_TAG: ${{ inputs.build_tag }}
        run: npx --no-install tauri build --target x86_64-pc-windows-msvc --no-bundle
      - name: Package the portable zip and check the manifest
        shell: bash
        run: |
          set -euo pipefail
          name="OnePaste-${LABEL}-windows-x64"
          mkdir -p "dist/$name"
          cp apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/onepaste-desktop.exe "dist/$name/OnePaste.exe"
          cp packaging/READ-ME-FIRST.windows.txt "dist/$name/READ-ME-FIRST.txt"
          python tools/check_exe_manifest.py "dist/$name/OnePaste.exe"
          python tools/make_zip.py "dist/$name" "dist/$name-portable.zip"
          python tools/check_portable_zip.py "dist/$name-portable.zip" OnePaste.exe READ-ME-FIRST.txt
          rm -rf "dist/$name"
          ls -l dist
      - name: Smoke test (unzip, start, stay alive for 10 seconds)
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter *-portable.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath smoke
          $exe = Get-ChildItem smoke -Recurse -Filter OnePaste.exe | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            Write-Error "The program exited early with code $($p.ExitCode)"
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "The program was still running after 10 seconds"
      - uses: actions/upload-artifact@v4
        with:
          name: portable-windows-x64
          path: dist/*-portable.zip
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error

  macos-universal:
    name: macos-universal
    runs-on: macos-latest
    env:
      LABEL: ${{ inputs.label }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default stable
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Choose ad hoc signing or Developer ID signing with notarization
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
            echo "No Apple signing secrets are configured: the app is signed ad hoc and not notarized"
            exit 0
          fi
          missing=""
          for v in APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v:-}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "FAIL: APPLE_CERTIFICATE is set but these secrets are missing:$missing"
            exit 1
          fi
          # Tauri reads these variables, imports the certificate into a temporary keychain, signs, and notarizes
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            echo "::add-mask::${!v}"
            printf '%s=%s\n' "$v" "${!v}" >> "$GITHUB_ENV"
          done
          echo "mode=developer-id" >> "$GITHUB_OUTPUT"
          echo "Apple signing secrets found: the app is signed with the Developer ID certificate and notarized"
      - name: Build the universal app bundle (no dmg)
        working-directory: apps/desktop
        env:
          ONEPASTE_BUILD_TAG: ${{ inputs.build_tag }}
        run: npx --no-install tauri build --target universal-apple-darwin --bundles app
      - name: Check architectures, package with ditto and verify the signature
        run: |
          set -euo pipefail
          app="apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/OnePaste.app"
          exe_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          archs=$(lipo -archs "$app/Contents/MacOS/$exe_name")
          echo "architectures: $archs"
          case "$archs" in *x86_64*) ;; *) echo "FAIL: x86_64 is missing"; exit 1;; esac
          case "$archs" in *arm64*) ;; *) echo "FAIL: arm64 is missing"; exit 1;; esac
          mkdir -p dist
          zip="dist/OnePaste-${LABEL}-macos-universal-portable.zip"
          # The zip holds OnePaste.app and, next to it, READ-ME-FIRST.txt
          rm -rf stage && mkdir stage
          ditto "$app" stage/OnePaste.app
          cp packaging/READ-ME-FIRST.macos.txt stage/READ-ME-FIRST.txt
          ditto -c -k stage "$zip"
          python3 tools/check_portable_zip.py "$zip" READ-ME-FIRST.txt prefix:OnePaste.app/
          rm -rf smoke && mkdir smoke
          ditto -x -k "$zip" smoke
          codesign --verify --deep --strict --verbose=2 smoke/OnePaste.app
          details=$(codesign -dv --verbose=4 smoke/OnePaste.app 2>&1)
          echo "$details"
          if [ "${{ steps.signing.outputs.mode }}" = "developer-id" ]; then
            # Secrets were given, so anything short of a notarized Developer ID app is a failure, never a quiet fallback
            grep -q 'Authority=Developer ID Application' <<<"$details" || { echo "FAIL: the app is not signed with a Developer ID Application certificate"; exit 1; }
            if grep -q 'Signature=adhoc' <<<"$details"; then echo "FAIL: the app was signed ad hoc although signing secrets were given"; exit 1; fi
            xcrun stapler validate smoke/OnePaste.app
            spctl --assess --type execute --verbose=2 smoke/OnePaste.app
          else
            grep -q 'Signature=adhoc' <<<"$details" || { echo "FAIL: expected an ad hoc signature"; exit 1; }
          fi
          ls -l dist
      - name: Smoke test (unzip, start, stay alive for 10 seconds)
        run: |
          set -uo pipefail
          exe_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' smoke/OnePaste.app/Contents/Info.plist)
          "smoke/OnePaste.app/Contents/MacOS/$exe_name" > smoke.log 2>&1 &
          pid=$!
          sleep 10
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "FAIL: the program exited early"; cat smoke.log; exit 1
          fi
          kill "$pid"
          echo "The program was still running after 10 seconds"
      - uses: actions/upload-artifact@v4
        with:
          name: portable-macos-universal
          path: dist/*-portable.zip
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error
