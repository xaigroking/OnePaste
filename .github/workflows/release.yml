name: release

# Named releases (v<version>-beta.<N>): a person makes the annotated tag. The automatic pre-releases of the main branch
# (v<version>-main.<N>) have their own workflow, release-main.yml, and are ignored here.
on:
  push:
    tags: ["v*", "!v*-main.*"]

permissions:
  contents: read

jobs:
  check:
    name: pre-release checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the annotated tag
        run: git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - name: Run the checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release-check.sh "$GITHUB_REF_NAME"

  build:
    name: build
    needs: check
    uses: ./.github/workflows/build-portable.yml
    with:
      label: ${{ github.ref_name }}
      build_tag: ${{ github.ref_name }}
      retention_days: 1
      include_tools: true
    # The optional Apple signing secrets (see the comment at the top of build-portable.yml)
    secrets: inherit

  publish:
    name: publish pre-release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the annotated tag
        run: git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: staged
          merge-multiple: true
      - name: Collect the files and write the checksums and the release notes
        run: |
          set -euo pipefail
          bash scripts/collect-release.sh "$GITHUB_REF_NAME" staged out downloads.md
          git for-each-ref --format='%(contents)' "refs/tags/${GITHUB_REF_NAME}" > notes.md
          { echo; cat packaging/release-notes/try-it.txt; echo; sed "s/{{TAG}}/$GITHUB_REF_NAME/g" packaging/release-notes/docker.txt; echo; cat downloads.md; } >> notes.md
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            out/*.zip
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease \
            --title "OnePaste $GITHUB_REF_NAME" --notes-file notes.md \
            out/*.zip out/SHA256SUMS.txt

  # After the pre-release is out: the server container image, tagged with the version (not as edge)
  image:
    name: server image
    needs: publish
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/docker-image.yml
    with:
      tag: ${{ github.ref_name }}
      edge: false
