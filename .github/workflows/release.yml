name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: pre-release checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the annotated tag
        run: git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - name: Run the checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release-check.sh "$GITHUB_REF_NAME"

  build:
    name: build
    needs: check
    uses: ./.github/workflows/build-portable.yml
    with:
      label: ${{ github.ref_name }}
      build_tag: ${{ github.ref_name }}
      retention_days: 1
    # The optional Apple signing secrets (see the comment at the top of build-portable.yml)
    secrets: inherit

  publish:
    name: publish pre-release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the annotated tag
        run: git fetch --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      - uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: staged
          merge-multiple: true
      - name: Collect the files and write the checksums and the release notes
        run: |
          set -euo pipefail
          win="OnePaste-${GITHUB_REF_NAME}-windows-x64-portable.zip"
          mac="OnePaste-${GITHUB_REF_NAME}-macos-universal-portable.zip"
          mkdir -p out
          for f in "$win" "$mac"; do
            test -f "staged/$f" || { echo "missing build output: $f"; ls -R staged; exit 1; }
            cp "staged/$f" out/
          done
          python3 tools/check_portable_zip.py "out/$win" OnePaste.exe READ-ME-FIRST.txt
          python3 tools/check_portable_zip.py "out/$mac" READ-ME-FIRST.txt prefix:OnePaste.app/
          (cd out && sha256sum "$win" "$mac" > SHA256SUMS.txt && cat SHA256SUMS.txt)
          git for-each-ref --format='%(contents)' "refs/tags/${GITHUB_REF_NAME}" > notes.md
          {
            echo
            echo "## Downloads"
            echo
            echo "| Platform | Architecture | File |"
            echo "|---|---|---|"
            echo "| Windows | x64 | \`$win\` |"
            echo "| macOS | Apple silicon + Intel (universal) | \`$mac\` |"
          } >> notes.md
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            out/*.zip
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease \
            --title "OnePaste $GITHUB_REF_NAME" --notes-file notes.md \
            out/*.zip out/SHA256SUMS.txt
