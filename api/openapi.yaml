openapi: 3.1.0
info:
  title: OnePaste 同步服务接口
  version: "1"
  description: |
    自建同步服务的接口契约。服务端只保存密文和必要的元数据，口令与主密钥永远不会发给服务端。

    ## 通用约定
    - 只走 HTTPS，不提供明文 HTTP。基础路径是 `/v1`，请求和响应都是 JSON（`GET /events` 除外）。
    - 请求和响应都带头 `OnePaste-Proto: 1`。服务端不支持客户端的版本时返回 400 `unsupported_version`，并附上 `min`、`max`。
    - 每个响应都带头 `X-Request-Id`。
    - 错误响应体统一为 `{"code": "<稳定错误码>", "request_id": "..."}`，可以附结构化字段；不带自然语言文案，文案由客户端本地化。
    - 写请求（PUT、POST、DELETE）必须带 `Idempotency-Key` 头。同一个 key 加同样的请求体，至少 24 小时内返回同样的响应；同一个 key 加不同的请求体，返回 422 `idempotency_conflict`。
    - 服务端不得记录请求体和响应体；日志只写方法、路径、状态码、`request_id`、耗时。
    - 限速：`register`、`invite` 每个 IP 每分钟 10 次；认证失败每个 IP 每分钟 20 次，失败越多退避越久。超限返回 429 `rate_limited`，带 `Retry-After` 头。

    ## 认证
    - 设备令牌：`Authorization: Bearer <device_token>`。令牌是 32 字节随机数，用 base64url 编码，不带填充；服务端只存它的 SHA-256。
    - 令牌无效或设备已撤销：返回 401 `unauthorized`。
    - 口令不发给服务端，服务端不保存任何由口令派生出来的验证值，加密后的主密钥记录除外。

    ## 连接码与注册凭据
    - 连接码格式：`onepaste1:` 加上 base64url（不带填充）编码的 UTF-8 JSON `{"u":"https://主机:端口","fp":"<服务端证书 SPKI 的 SHA-256，base64url>","t":"<注册凭据>"}`。
    - 注册凭据是 32 字节随机数，用 base64url 编码；服务端只存它的 SHA-256。只能用一次，24 小时后过期。
    - 服务端首次启动且库里还没有任何设备时，生成一个注册凭据，把完整的连接码打印到标准输出。子命令 `onepaste-server connect-code` 重新生成一个连接码，同时作废之前还没用掉的注册凭据。不设管理员账号，也没有默认密码。

    ## 首台设备的流程
    1. 粘贴连接码。
    2. 本地设置口令、生成主密钥。
    3. `POST /devices/register`。
    4. `PUT /vault/keyparams`，`base_version` 为 0。

    ## 新设备的流程
    1. 粘贴连接码。
    2. `POST /devices/register`。
    3. `GET /vault/keyparams`。
    4. 本地用口令解开主密钥。

    ## 版本与冲突
    - 服务端为整个库维护一个全局递增的序号 `seq`；每接受一次写入，就把 `seq` 加 1 分配给这条记录。
    - 条目写入的 `base_seq` 必须等于该条目当前的 `seq`，新条目填 0；不相等返回 409 `stale`，响应里附上当前条目。
    - 条目的正文创建后不再修改；可以改的只有收藏、置顶、备注、标签，它们都在 `sealed` 里面，修改时整条重新 `PUT`。
    - 客户端收到 `stale` 时：取最新版本，解密，把用户这次想做的那一处改动重新套用到最新版本上，带上新的 `base_seq` 重试。最多重试 3 次，仍然失败就把冲突显示给用户。
    - 任何地方都不得用 `created_at`、`updated_at` 或设备时钟判断新旧，时间字段只用于显示。

    ## 墓碑
    - 墓碑保留 90 天，之后服务端可以清理。游标比保留期更早时，拉取返回 410 `cursor_expired`，客户端从 `after=0` 全量重拉。

    ## 变更通知
    - 通知只是提示。客户端收到通知、重新连上、睡眠唤醒、网络切换之后，都按游标拉一次；数据一律以拉取结果为准。

    ## 防回滚（客户端规则）
    - 客户端记下自己见过的最大 `seq`。服务端返回的最新 `seq` 比它小，说明服务端被回滚：报本地错误 `server_rollback`，暂停同步，托盘显示「出错」。
    - 同一个条目，不接受 `seq` 比本地记录更小的版本。

    ## 客户端本地错误码
    下面两个错误码只在客户端本地产生，不出现在 HTTP 响应里。
    - `server_rollback`：服务端返回的 `seq` 比客户端见过的更小。
    - `decrypt_failed`：密文无法解密。

    ## 错误码与 HTTP 状态
    | 错误码 | HTTP 状态 |
    |---|---|
    | `invalid_argument` | 400 |
    | `unsupported_version` | 400 |
    | `malformed_envelope` | 400 |
    | `unauthorized` | 401 |
    | `registration_invalid` | 401 |
    | `not_found` | 404 |
    | `vault_empty` | 404 |
    | `stale` | 409 |
    | `cursor_expired` | 410 |
    | `too_large` | 413 |
    | `idempotency_conflict` | 422 |
    | `rate_limited` | 429 |
    | `internal` | 500 |

servers:
  - url: https://{host}:{port}/v1
    variables:
      host:
        default: localhost
      port:
        default: "8443"

tags:
  - name: devices
    description: 设备注册、邀请、列表与撤销。
  - name: vault
    description: 加密后的主密钥记录。
  - name: items
    description: 条目的写入与按游标拉取。
  - name: events
    description: 变更通知。

security:
  - deviceToken: []

paths:
  /devices/register:
    post:
      tags: [devices]
      operationId: registerDevice
      summary: 用注册凭据注册设备
      description: 注册凭据无效、过期或已用过，返回 401 `registration_invalid`。
      security: []
      parameters:
        - $ref: "#/components/parameters/ProtoHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: 注册成功。
          headers:
            OnePaste-Proto:
              $ref: "#/components/headers/OnePasteProto"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/RegistrationInvalid"
        "422":
          $ref: "#/components/responses/IdempotencyConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /devices/invite:
    post:
      tags: [devices]
      operationId: inviteDevice
      summary: 生成新的注册凭据
      description: 客户端用自己已知的 `u`、`fp` 和返回的 `reg_token` 拼出连接码，交给新设备。
      parameters:
        - $ref: "#/components/parameters/ProtoHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: 新的注册凭据。
          headers:
            OnePaste-Proto:
              $ref: "#/components/headers/OnePasteProto"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/IdempotencyConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: 设备列表
      parameters:
        - $ref: "#/components/parameters/ProtoHeader"
      responses:
        "200":
          description: 全部设备，包含已撤销的。
          headers:
            OnePaste-Proto:
              $ref: "#/components/headers/OnePasteProto"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /devices/{id}:
    delete:
      tags: [devices]
      operationId: revokeDevice
      summary: 撤销设备
      description: 立即生效。可以撤销自己。
      parameters:
        - $ref: "#/components/parameters/ProtoHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          description: 设备标识，即注册时的 `device_id`。
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "204":
          description: 已撤销。
          headers:
            OnePaste-Proto:
              $ref: "#/components/headers/OnePasteProto"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/IdempotencyConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /vault/keyparams:
    get:
      tags: [vault]
      operationId: getKeyParams
      summary: 取密钥参数记录
      description: 记录原样返回，另附 `version`。还没有记录时返回 404 `vault_empty`。
      parameters:
        - $ref: "#/components/parameters/ProtoHeader"
      responses:
        "200":
          description: 密钥参数记录与当前版本。
          headers:
            OnePaste-Proto:
              $ref: "#/components/headers/OnePasteProto"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyParamsView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/VaultEmpty"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
    put:
      tags: [vault]
      operationId: putKeyParams
      summary: 写密钥参数记录
      description: |
        首次创建时 `base_version` 为 0；改口令或用恢复套件重置时，`base_version` 填当前的 `version`。
        不一致返回 409 `stale`，响应里附上当前记录。
      parameters:
        - $ref: "#/components/parameters/ProtoHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutKeyParamsRequest"
      responses:
        "200":
          description: 已写入，返回新的版本。
          headers:
            OnePaste-Proto:
              $ref: "#/components/headers/OnePasteProto"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutKeyParamsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Stale"
        "422":
          $ref: "#/components/responses/IdempotencyConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /items/{id}:
    put:
      tags: [items]
      operationId: putItem
      summary: 新建、修改或删除条目
      description: |
        请求体二选一：`{base_seq, envelope}` 新建或修改；`{base_seq, deleted: true}` 删除。
        删除后服务端只保留 `id`、`seq`、`deleted_at`，密文被删掉。
        `size` 不超过 8 MiB，请求体不超过 12 MiB，超出返回 413 `too_large`。
        信封不合法返回 400 `malformed_envelope`。
      parameters:
        - $ref: "#/components/parameters/ProtoHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          description: 条目标识，必须和信封里的 `id` 相同。
          schema:
            $ref: "#/components/schemas/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/ItemUpsert"
                - $ref: "#/components/schemas/ItemDelete"
      responses:
        "200":
          description: 已接受，返回分配给该条目的 `seq`。
          headers:
            OnePaste-Proto:
              $ref: "#/components/headers/OnePasteProto"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Stale"
        "413":
          $ref: "#/components/responses/TooLarge"
        "422":
          $ref: "#/components/responses/IdempotencyConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /items:
    get:
      tags: [items]
      operationId: listItems
      summary: 按游标拉取条目
      description: |
        按 `seq` 升序返回 `seq` 大于 `after` 的条目。
        `after` 比墓碑保留期更早时返回 410 `cursor_expired`。
      parameters:
        - $ref: "#/components/parameters/ProtoHeader"
        - name: after
          in: query
          required: false
          description: 游标，只返回 `seq` 大于它的条目；默认 0。
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          description: 本页最多返回的条目数。
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        "200":
          description: 一页条目。
          headers:
            OnePaste-Proto:
              $ref: "#/components/headers/OnePasteProto"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          $ref: "#/components/responses/CursorExpired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /events:
    get:
      tags: [events]
      operationId: streamEvents
      summary: 订阅变更通知（SSE）
      description: |
        有新写入时推送一条事件，`data` 是 `{"seq": <最新 seq>}`。每 25 秒发一次心跳注释。
      parameters:
        - $ref: "#/components/parameters/ProtoHeader"
      responses:
        "200":
          description: 事件流。
          headers:
            OnePaste-Proto:
              $ref: "#/components/headers/OnePasteProto"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            text/event-stream:
              schema:
                type: string
                contentMediaType: application/json
                contentSchema:
                  $ref: "#/components/schemas/ChangeEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

components:
  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
      description: 设备令牌，32 字节随机数的 base64url 编码，不带填充。

  headers:
    OnePasteProto:
      description: 协议版本，当前为 1。
      required: true
      schema:
        type: string
        enum: ["1"]
    RequestId:
      description: 本次请求的标识。
      required: true
      schema:
        type: string
    RetryAfter:
      description: 多少秒之后可以重试。
      required: true
      schema:
        type: integer
        minimum: 1

  parameters:
    ProtoHeader:
      name: OnePaste-Proto
      in: header
      required: true
      description: 客户端使用的协议版本，当前为 1。
      schema:
        type: string
        enum: ["1"]
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 客户端为这次写请求生成的唯一值。
      schema:
        type: string
        minLength: 1
        maxLength: 128

  responses:
    BadRequest:
      description: 错误码为 `invalid_argument`、`unsupported_version` 或 `malformed_envelope`。
      headers:
        OnePaste-Proto:
          $ref: "#/components/headers/OnePasteProto"
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: 错误码为 `unauthorized`：令牌无效或设备已撤销。
      headers:
        OnePaste-Proto:
          $ref: "#/components/headers/OnePasteProto"
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RegistrationInvalid:
      description: 错误码为 `registration_invalid`：注册凭据无效、过期或已用过。
      headers:
        OnePaste-Proto:
          $ref: "#/components/headers/OnePasteProto"
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 错误码为 `not_found`。
      headers:
        OnePaste-Proto:
          $ref: "#/components/headers/OnePasteProto"
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    VaultEmpty:
      description: 错误码为 `vault_empty`：还没有密钥参数记录。
      headers:
        OnePaste-Proto:
          $ref: "#/components/headers/OnePasteProto"
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Stale:
      description: 错误码为 `stale`：`base_seq` 或 `base_version` 与当前值不一致。条目写入附 `current_item`，密钥参数写入附 `current_keyparams`。
      headers:
        OnePaste-Proto:
          $ref: "#/components/headers/OnePasteProto"
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CursorExpired:
      description: 错误码为 `cursor_expired`：游标比墓碑保留期更早，客户端从 `after=0` 全量重拉。
      headers:
        OnePaste-Proto:
          $ref: "#/components/headers/OnePasteProto"
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooLarge:
      description: 错误码为 `too_large`：`size` 超过 8 MiB 或请求体超过 12 MiB。
      headers:
        OnePaste-Proto:
          $ref: "#/components/headers/OnePasteProto"
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    IdempotencyConflict:
      description: 错误码为 `idempotency_conflict`：同一个 `Idempotency-Key` 对应了不同的请求体。
      headers:
        OnePaste-Proto:
          $ref: "#/components/headers/OnePasteProto"
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: 错误码为 `rate_limited`。
      headers:
        OnePaste-Proto:
          $ref: "#/components/headers/OnePasteProto"
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: 错误码为 `internal`。
      headers:
        OnePaste-Proto:
          $ref: "#/components/headers/OnePasteProto"
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    ErrorCode:
      type: string
      description: 稳定错误码，只增不改。
      enum:
        - invalid_argument
        - unsupported_version
        - malformed_envelope
        - unauthorized
        - registration_invalid
        - not_found
        - vault_empty
        - stale
        - cursor_expired
        - too_large
        - idempotency_conflict
        - rate_limited
        - internal

    Error:
      type: object
      description: 统一的错误响应体，不含自然语言文案。
      required: [code, request_id]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        request_id:
          type: string
          description: 本次请求的标识，与响应头 `X-Request-Id` 相同。
        min:
          type: integer
          description: 服务端支持的最低协议版本，`unsupported_version` 时附上。
        max:
          type: integer
          description: 服务端支持的最高协议版本，`unsupported_version` 时附上。
        current_item:
          $ref: "#/components/schemas/ItemRecord"
        current_keyparams:
          $ref: "#/components/schemas/KeyParamsView"

    Id:
      type: string
      description: 标识，只允许 `[A-Za-z0-9_-]`，长度不超过 64。设备和条目的标识由客户端生成，为 UUIDv7。
      pattern: "^[A-Za-z0-9_-]{1,64}$"

    Base64:
      type: string
      description: 标准 base64 编码。
      contentEncoding: base64

    Timestamp:
      type: integer
      format: int64
      description: 秒级时间戳，只用于显示和排序，不用来判断新旧。

    RegisterRequest:
      type: object
      required: [reg_token, device_id, sealed_name]
      properties:
        reg_token:
          type: string
          description: 注册凭据，32 字节随机数的 base64url 编码。
        device_id:
          $ref: "#/components/schemas/Id"
        sealed_name:
          allOf:
            - $ref: "#/components/schemas/Base64"
          description: 用主密钥加密的设备名，AAD 为 `onepaste/device/v1:<device_id>`。

    RegisterResponse:
      type: object
      required: [device_token]
      properties:
        device_token:
          type: string
          description: 设备令牌，32 字节随机数的 base64url 编码，不带填充。

    InviteResponse:
      type: object
      required: [reg_token, expires_at]
      properties:
        reg_token:
          type: string
          description: 新的注册凭据，只能用一次。
        expires_at:
          $ref: "#/components/schemas/Timestamp"

    Device:
      type: object
      required: [device_id, sealed_name, created_at, last_seen_at, revoked]
      properties:
        device_id:
          $ref: "#/components/schemas/Id"
        sealed_name:
          $ref: "#/components/schemas/Base64"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        last_seen_at:
          description: 最近一次认证成功的时间；从未使用过为 null。
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        revoked:
          type: boolean
          description: 设备是否已被撤销。

    KdfParams:
      type: object
      description: Argon2id 参数。
      required: [m_kib, t, p]
      properties:
        m_kib:
          type: integer
          minimum: 8192
          description: 内存，单位 KiB。
        t:
          type: integer
          minimum: 1
          description: 迭代轮数。
        p:
          type: integer
          minimum: 1
          description: 并行度。

    KeyParamsRecord:
      type: object
      description: 密钥参数记录。
      required: [v, salt, kdf, wrapped_mk]
      properties:
        v:
          type: integer
          description: 记录格式版本，当前为 1。
        salt:
          allOf:
            - $ref: "#/components/schemas/Base64"
          description: 口令派生用的盐。
        kdf:
          $ref: "#/components/schemas/KdfParams"
        wrapped_mk:
          allOf:
            - $ref: "#/components/schemas/Base64"
          description: 被口令派生密钥包装的主密钥。
        mk_check:
          allOf:
            - $ref: "#/components/schemas/Base64"
          description: 主密钥校验值，用来确认手上的主密钥属于这个库；旧记录没有这个字段。

    KeyParamsView:
      description: 密钥参数记录加上服务端维护的版本。
      allOf:
        - $ref: "#/components/schemas/KeyParamsRecord"
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              format: int64
              minimum: 1
              description: 记录当前的版本，每次成功写入加 1。

    PutKeyParamsRequest:
      type: object
      required: [record, base_version]
      properties:
        record:
          $ref: "#/components/schemas/KeyParamsRecord"
        base_version:
          type: integer
          format: int64
          minimum: 0
          description: 客户端所基于的 `version`；首次创建为 0。

    PutKeyParamsResponse:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
          description: 写入后的版本。

    Envelope:
      type: object
      description: 条目信封。服务端只能看到这些字段，其余内容都在 `sealed` 里面。
      required: [v, id, created_at, updated_at, size, sealed]
      properties:
        v:
          type: integer
          minimum: 1
          description: 信封版本，当前为 1，不认识就拒绝。
        id:
          $ref: "#/components/schemas/Id"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          description: 不得小于 `created_at`。
        size:
          type: integer
          format: int64
          minimum: 0
          maximum: 8388608
          description: 必须等于 `sealed` 解码后的字节数。
        blob_id:
          allOf:
            - $ref: "#/components/schemas/Id"
          description: 可选，对应的大对象标识。
        sealed:
          type: string
          contentEncoding: base64
          maxLength: 11184812
          description: base64（`nonce(24) ‖ 密文 ‖ 标签(16)`），算法 XChaCha20-Poly1305。

    ItemUpsert:
      type: object
      description: 新建或修改。
      required: [base_seq, envelope]
      properties:
        base_seq:
          type: integer
          format: int64
          minimum: 0
          description: 该条目当前的 `seq`；新条目为 0。
        envelope:
          $ref: "#/components/schemas/Envelope"

    ItemDelete:
      type: object
      description: 删除，不带信封。
      required: [base_seq, deleted]
      properties:
        base_seq:
          type: integer
          format: int64
          minimum: 0
          description: 该条目当前的 `seq`。
        deleted:
          type: boolean
          const: true
          description: 固定为 true。

    PutItemResponse:
      type: object
      required: [seq]
      properties:
        seq:
          type: integer
          format: int64
          minimum: 1
          description: 分配给该条目的 `seq`。

    ItemRecord:
      type: object
      required: [id, seq, deleted]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        seq:
          type: integer
          format: int64
          minimum: 1
          description: 该条目最近一次写入分配到的序号。
        deleted:
          type: boolean
          description: 是否已删除。
        envelope:
          allOf:
            - $ref: "#/components/schemas/Envelope"
          description: 未删除时才有。

    ItemPage:
      type: object
      required: [items, next_after, has_more]
      properties:
        items:
          type: array
          description: 按 `seq` 升序排列。
          items:
            $ref: "#/components/schemas/ItemRecord"
        next_after:
          type: integer
          format: int64
          minimum: 0
          description: 下一页请求用的 `after`。
        has_more:
          type: boolean
          description: 后面是否还有条目。

    ChangeEvent:
      type: object
      required: [seq]
      properties:
        seq:
          type: integer
          format: int64
          minimum: 0
          description: 当前最新的 `seq`。
