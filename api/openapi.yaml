openapi: 3.1.0
info:
  title: OnePaste sync service API
  version: "1.1"
  description: |
    Contract of the self-hosted sync service. The server stores only ciphertext and the metadata it needs; the passphrase and the master key are never sent to the server.

    ## General conventions
    - HTTPS only; plain HTTP is not offered. The base path is `/v1`, and requests and responses are JSON (except `GET /events`).
    - Requests and responses carry the header `OnePaste-Proto: 1`. If the server does not support the client version it returns 400 `unsupported_version` with `min` and `max`.
    - Every response carries the header `X-Request-Id`.
    - Error bodies are always `{"code": "<stable error code>", "request_id": "..."}` and may carry structured fields. They contain no natural-language text; clients localize the wording.
    - Write requests (PUT, POST, DELETE) must carry an `Idempotency-Key` header. The same key with the same body returns the same response for at least 24 hours; the same key with a different body returns 422 `idempotency_conflict`.
    - The server must not log request or response bodies; logs contain only method, path, status, `request_id` and latency.
    - Rate limits: `register`, `invite` and `GET /vault/keyparams` with an `OnePaste-Reg-Token` allow 10 requests per IP per minute in total; failed authentication (including a wrong `vault_proof`) allows 20 per IP per minute, with longer back-off the more failures there are. Exceeding a limit returns 429 `rate_limited` with a `Retry-After` header.

    ## Authentication
    - Device token: `Authorization: Bearer <device_token>`. The token is 32 random bytes encoded as base64url without padding; the server stores only its SHA-256.
    - An invalid token or a revoked device returns 401 `unauthorized`.
    - The passphrase is never sent to the server, and the server stores no verification value derived from it, apart from the encrypted master key record.

    ## Connection code and registration credential
    - Connection code format: `onepaste1:` followed by base64url (no padding) of the UTF-8 JSON `{"u":"https://host:port","fp":"<SHA-256 of the server certificate SPKI, base64url>","t":"<registration credential>"}`.
    - A registration credential is 32 random bytes encoded as base64url; the server stores only its SHA-256. It can be used once and expires after 24 hours.
    - On first start, when the database has no device yet, the server generates a registration credential and prints the full connection code to standard output. The subcommand `onepaste-server connect-code` generates a new connection code and invalidates registration credentials that are still unused. There is no admin account and no default password.

    ## Vault proof
    - `vault_proof` = `SHA-256("onepaste/vault-proof/v1" || master key)`, sent as base64url without padding. The prefix is an ASCII literal without a trailing zero byte.
    - The server stores only `SHA-256(vault_proof)` and compares in constant time.
    - Registering a device, changing the passphrase and resetting it with the recovery kit all require the correct `vault_proof`; holding a connection code or a device token is not enough.

    ## First device flow
    1. Paste the connection code.
    2. Set the passphrase, generate the master key and the key parameter record locally.
    3. `POST /devices/register` with `init` (the record and the `vault_proof`).

    ## New device flow
    1. Paste the connection code.
    2. `GET /vault/keyparams` with the header `OnePaste-Reg-Token`.
    3. Unlock the master key locally with the passphrase and confirm it with `mk_check`.
    4. `POST /devices/register` with `vault_proof`.

    ## Versions and conflicts
    - The server keeps one global, increasing sequence number `seq` for the whole vault; every accepted write increments it and assigns the new value to the record.
    - The `base_seq` of an item write must equal the current `seq` of that item (0 for a new item); otherwise the server returns 409 `stale` with the current item attached.
    - The body of an item is never modified after creation; only favorite, pinned, note and tags can change, and they live inside `sealed`, so a change re-`PUT`s the whole item.
    - On `stale` the client fetches the latest version, decrypts it, re-applies the one change the user wanted on top of it and retries with the new `base_seq`. It retries at most 3 times and then shows the conflict to the user.
    - Nothing may use `created_at`, `updated_at` or a device clock to decide which version is newer; time fields are for display only.

    ## Tombstones
    - Tombstones are kept for 90 days, after which the server may purge them. A cursor older than the retention window gets 410 `cursor_expired` on pull, and the client re-pulls everything from `after=0`.

    ## Change notifications
    - A notification is only a hint. After a notification, a reconnect, a wake from sleep or a network switch the client pulls once by cursor; the pull result is always the source of truth.

    ## Rollback protection (client rule)
    - The client remembers the largest `seq` it has seen. If the latest `seq` returned by the server is smaller, the server was rolled back: report the local error `server_rollback`, pause syncing and show the error state in the tray.
    - For one item, never accept a version whose `seq` is smaller than the local record.

    ## Client-local error codes
    The two error codes below are produced only on the client and never appear in HTTP responses.
    - `server_rollback`: the `seq` returned by the server is smaller than the client has seen.
    - `decrypt_failed`: the ciphertext cannot be decrypted.

    ## Error codes and HTTP status
    | Error code | HTTP status |
    |---|---|
    | `invalid_argument` | 400 |
    | `unsupported_version` | 400 |
    | `malformed_envelope` | 400 |
    | `unauthorized` | 401 |
    | `registration_invalid` | 401 |
    | `not_found` | 404 |
    | `vault_empty` | 404 |
    | `stale` | 409 |
    | `cursor_expired` | 410 |
    | `too_large` | 413 |
    | `idempotency_conflict` | 422 |
    | `rate_limited` | 429 |
    | `internal` | 500 |

servers:
  - url: https://{host}:{port}/v1
    variables:
      host:
        default: localhost
      port:
        default: "8443"

tags:
  - name: devices
    description: Device registration, invitation, listing and revocation.
  - name: vault
    description: The encrypted master key record.
  - name: items
    description: Writing items and pulling them by cursor.
  - name: events
    description: Change notifications.

security:
  - deviceToken: []

paths:
  /devices/register:
    post:
      tags: [devices]
      operationId: registerDevice
      summary: Register a device with a registration credential
      description: |
        An invalid, expired or already used registration credential returns 401 `registration_invalid`. The credential is marked as used only after the registration succeeds.
        Vault still empty: `init` is required and the top-level `vault_proof` must be absent; the server creates the record (`version` 1), stores the hash of the `vault_proof` and creates the device in one transaction.
        Vault already exists: the top-level `vault_proof` is required and `init` must be absent; a wrong `vault_proof` returns 401 `registration_invalid`, counts towards the failed-authentication limit and does not consume the credential.
        Any other combination returns 400 `invalid_argument`.
      security: []
      parameters:
        - $ref: "#/components/parameters/ProtoHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Registration succeeded.
          headers:
            OnePaste-Proto:
              $ref: "#/components/headers/OnePasteProto"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/RegistrationInvalid"
        "422":
          $ref: "#/components/responses/IdempotencyConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /devices/invite:
    post:
      tags: [devices]
      operationId: inviteDevice
      summary: Create a new registration credential
      description: The client builds a connection code from the `u` and `fp` it already knows plus the returned `reg_token` and hands it to the new device.
      parameters:
        - $ref: "#/components/parameters/ProtoHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The new registration credential.
          headers:
            OnePaste-Proto:
              $ref: "#/components/headers/OnePasteProto"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/IdempotencyConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: List devices
      parameters:
        - $ref: "#/components/parameters/ProtoHeader"
      responses:
        "200":
          description: All devices, including revoked ones.
          headers:
            OnePaste-Proto:
              $ref: "#/components/headers/OnePasteProto"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /devices/{id}:
    delete:
      tags: [devices]
      operationId: revokeDevice
      summary: Revoke a device
      description: Takes effect immediately. A device may revoke itself.
      parameters:
        - $ref: "#/components/parameters/ProtoHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          description: Device identifier, the `device_id` used at registration.
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "204":
          description: Revoked.
          headers:
            OnePaste-Proto:
              $ref: "#/components/headers/OnePasteProto"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/IdempotencyConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /vault/keyparams:
    get:
      tags: [vault]
      operationId: getKeyParams
      summary: Get the key parameter record
      description: |
        Returns the record as stored plus `version`. If there is no record yet it returns 404 `vault_empty`.
        Besides the device token it also accepts the header `OnePaste-Reg-Token`, so that a new device can fetch the record before it registers. In that case the credential is only checked for validity, not consumed, and the request counts towards the registration rate limit.
      security:
        - deviceToken: []
        - regToken: []
      parameters:
        - $ref: "#/components/parameters/ProtoHeader"
      responses:
        "200":
          description: The key parameter record and its current version.
          headers:
            OnePaste-Proto:
              $ref: "#/components/headers/OnePasteProto"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyParamsView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/VaultEmpty"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"
    put:
      tags: [vault]
      operationId: putKeyParams
      summary: Write the key parameter record
      description: |
        Only for changing the passphrase and for resetting it with the recovery kit; `base_version` is the current `version`. A mismatch returns 409 `stale` with the current record attached.
        A wrong `vault_proof` returns 401 `unauthorized`. `base_version` 0 (creation) always returns 400 `invalid_argument`: the first record can only be created through the `init` of `POST /devices/register`.
      parameters:
        - $ref: "#/components/parameters/ProtoHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PutKeyParamsRequest"
      responses:
        "200":
          description: Written; returns the new version.
          headers:
            OnePaste-Proto:
              $ref: "#/components/headers/OnePasteProto"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutKeyParamsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Stale"
        "422":
          $ref: "#/components/responses/IdempotencyConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /items/{id}:
    put:
      tags: [items]
      operationId: putItem
      summary: Create, update or delete an item
      description: |
        The body is one of: `{base_seq, envelope}` to create or update, or `{base_seq, deleted: true}` to delete.
        After a delete the server keeps only `id`, `seq` and `deleted_at`; the ciphertext is removed.
        `size` may not exceed 8 MiB and the request body may not exceed 12 MiB; exceeding either returns 413 `too_large`.
        An invalid envelope returns 400 `malformed_envelope`.
      parameters:
        - $ref: "#/components/parameters/ProtoHeader"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: id
          in: path
          required: true
          description: Item identifier; must equal the `id` inside the envelope.
          schema:
            $ref: "#/components/schemas/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/ItemUpsert"
                - $ref: "#/components/schemas/ItemDelete"
      responses:
        "200":
          description: Accepted; returns the `seq` assigned to the item.
          headers:
            OnePaste-Proto:
              $ref: "#/components/headers/OnePasteProto"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Stale"
        "413":
          $ref: "#/components/responses/TooLarge"
        "422":
          $ref: "#/components/responses/IdempotencyConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /items:
    get:
      tags: [items]
      operationId: listItems
      summary: Pull items by cursor
      description: |
        Returns the items whose `seq` is greater than `after`, in ascending `seq` order. `head_seq` is read in the same transaction as the page.
        An `after` older than the tombstone retention window returns 410 `cursor_expired`.
      parameters:
        - $ref: "#/components/parameters/ProtoHeader"
        - name: after
          in: query
          required: false
          description: Cursor; only items with a `seq` greater than it are returned. Defaults to 0.
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          description: Maximum number of items on this page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        "200":
          description: One page of items.
          headers:
            OnePaste-Proto:
              $ref: "#/components/headers/OnePasteProto"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "410":
          $ref: "#/components/responses/CursorExpired"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

  /events:
    get:
      tags: [events]
      operationId: streamEvents
      summary: Subscribe to change notifications (SSE)
      description: |
        Pushes an event on every new write; `data` is `{"seq": <latest seq>}`. A heartbeat comment is sent every 25 seconds.
      parameters:
        - $ref: "#/components/parameters/ProtoHeader"
      responses:
        "200":
          description: The event stream.
          headers:
            OnePaste-Proto:
              $ref: "#/components/headers/OnePasteProto"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            text/event-stream:
              schema:
                type: string
                contentMediaType: application/json
                contentSchema:
                  $ref: "#/components/schemas/ChangeEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/Internal"

components:
  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
      description: "Device token: 32 random bytes encoded as base64url without padding."
    regToken:
      type: apiKey
      in: header
      name: OnePaste-Reg-Token
      description: Registration credential; accepted only by `GET /vault/keyparams`.

  headers:
    OnePasteProto:
      description: Protocol version, currently 1.
      required: true
      schema:
        type: string
        enum: ["1"]
    RequestId:
      description: Identifier of this request.
      required: true
      schema:
        type: string
    RetryAfter:
      description: Number of seconds to wait before retrying.
      required: true
      schema:
        type: integer
        minimum: 1

  parameters:
    ProtoHeader:
      name: OnePaste-Proto
      in: header
      required: true
      description: Protocol version used by the client, currently 1.
      schema:
        type: string
        enum: ["1"]
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A unique value generated by the client for this write request.
      schema:
        type: string
        minLength: 1
        maxLength: 128

  responses:
    BadRequest:
      description: The error code is `invalid_argument`, `unsupported_version` or `malformed_envelope`.
      headers:
        OnePaste-Proto:
          $ref: "#/components/headers/OnePasteProto"
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: "The error code is `unauthorized`: invalid token or revoked device."
      headers:
        OnePaste-Proto:
          $ref: "#/components/headers/OnePasteProto"
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RegistrationInvalid:
      description: "The error code is `registration_invalid`: the registration credential is invalid, expired or already used."
      headers:
        OnePaste-Proto:
          $ref: "#/components/headers/OnePasteProto"
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The error code is `not_found`.
      headers:
        OnePaste-Proto:
          $ref: "#/components/headers/OnePasteProto"
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    VaultEmpty:
      description: "The error code is `vault_empty`: there is no key parameter record yet."
      headers:
        OnePaste-Proto:
          $ref: "#/components/headers/OnePasteProto"
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Stale:
      description: "The error code is `stale`: `base_seq` or `base_version` differs from the current value. Item writes attach `current_item`; key parameter writes attach `current_keyparams`."
      headers:
        OnePaste-Proto:
          $ref: "#/components/headers/OnePasteProto"
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CursorExpired:
      description: "The error code is `cursor_expired`: the cursor is older than the tombstone retention window, so the client re-pulls from `after=0`."
      headers:
        OnePaste-Proto:
          $ref: "#/components/headers/OnePasteProto"
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooLarge:
      description: "The error code is `too_large`: `size` exceeds 8 MiB or the request body exceeds 12 MiB."
      headers:
        OnePaste-Proto:
          $ref: "#/components/headers/OnePasteProto"
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    IdempotencyConflict:
      description: "The error code is `idempotency_conflict`: the same `Idempotency-Key` was used with a different body."
      headers:
        OnePaste-Proto:
          $ref: "#/components/headers/OnePasteProto"
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: The error code is `rate_limited`.
      headers:
        OnePaste-Proto:
          $ref: "#/components/headers/OnePasteProto"
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: The error code is `internal`.
      headers:
        OnePaste-Proto:
          $ref: "#/components/headers/OnePasteProto"
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    VaultProof:
      type: string
      description: "`SHA-256(\"onepaste/vault-proof/v1\" || master key)` encoded as base64url without padding."

    ErrorCode:
      type: string
      description: Stable error code; codes may be added but never changed.
      enum:
        - invalid_argument
        - unsupported_version
        - malformed_envelope
        - unauthorized
        - registration_invalid
        - not_found
        - vault_empty
        - stale
        - cursor_expired
        - too_large
        - idempotency_conflict
        - rate_limited
        - internal

    Error:
      type: object
      description: The uniform error body; it contains no natural-language text.
      required: [code, request_id]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        request_id:
          type: string
          description: Identifier of this request, equal to the response header `X-Request-Id`.
        min:
          type: integer
          description: Lowest protocol version the server supports; attached with `unsupported_version`.
        max:
          type: integer
          description: Highest protocol version the server supports; attached with `unsupported_version`.
        current_item:
          $ref: "#/components/schemas/ItemRecord"
        current_keyparams:
          $ref: "#/components/schemas/KeyParamsView"

    Id:
      type: string
      description: "Identifier: only `[A-Za-z0-9_-]`, at most 64 characters. Device and item identifiers are generated by the client as UUIDv7."
      pattern: "^[A-Za-z0-9_-]{1,64}$"

    Base64:
      type: string
      description: Standard base64 encoding.
      contentEncoding: base64

    Timestamp:
      type: integer
      format: int64
      description: Timestamp in seconds, used only for display and ordering, never to decide which version is newer.

    RegisterInit:
      type: object
      description: Creates the first key parameter record together with the first device.
      required: [record, vault_proof]
      properties:
        record:
          $ref: "#/components/schemas/KeyParamsRecord"
        vault_proof:
          $ref: "#/components/schemas/VaultProof"

    RegisterRequest:
      type: object
      required: [reg_token, device_id, sealed_name]
      properties:
        vault_proof:
          allOf:
            - $ref: "#/components/schemas/VaultProof"
          description: Required when the vault already exists; must be absent when `init` is present.
        init:
          allOf:
            - $ref: "#/components/schemas/RegisterInit"
          description: Required when the vault is still empty; must be absent when `vault_proof` is present.
        reg_token:
          type: string
          description: "Registration credential: 32 random bytes encoded as base64url."
        device_id:
          $ref: "#/components/schemas/Id"
        sealed_name:
          allOf:
            - $ref: "#/components/schemas/Base64"
          description: Device name encrypted with the master key; the AAD is `onepaste/device/v1:<device_id>`.

    RegisterResponse:
      type: object
      required: [device_token]
      properties:
        device_token:
          type: string
          description: "Device token: 32 random bytes encoded as base64url without padding."

    InviteResponse:
      type: object
      required: [reg_token, expires_at]
      properties:
        reg_token:
          type: string
          description: The new registration credential; it can be used once.
        expires_at:
          $ref: "#/components/schemas/Timestamp"

    Device:
      type: object
      required: [device_id, sealed_name, created_at, last_seen_at, revoked]
      properties:
        device_id:
          $ref: "#/components/schemas/Id"
        sealed_name:
          $ref: "#/components/schemas/Base64"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        last_seen_at:
          description: Time of the last successful authentication; null if never used.
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        revoked:
          type: boolean
          description: Whether the device has been revoked.

    KdfParams:
      type: object
      description: Argon2id parameters.
      required: [m_kib, t, p]
      properties:
        m_kib:
          type: integer
          minimum: 8192
          description: Memory in KiB.
        t:
          type: integer
          minimum: 1
          description: Number of passes.
        p:
          type: integer
          minimum: 1
          description: Degree of parallelism.

    KeyParamsRecord:
      type: object
      description: The key parameter record.
      required: [v, salt, kdf, wrapped_mk, mk_check]
      properties:
        v:
          type: integer
          description: Record format version, currently 1.
        salt:
          allOf:
            - $ref: "#/components/schemas/Base64"
          description: Salt used for passphrase derivation.
        kdf:
          $ref: "#/components/schemas/KdfParams"
        wrapped_mk:
          allOf:
            - $ref: "#/components/schemas/Base64"
          description: The master key wrapped by the passphrase-derived key.
        mk_check:
          allOf:
            - $ref: "#/components/schemas/Base64"
          description: Master key check value, used to confirm that a master key in hand belongs to this vault.

    KeyParamsView:
      description: The key parameter record plus the version maintained by the server.
      allOf:
        - $ref: "#/components/schemas/KeyParamsRecord"
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              format: int64
              minimum: 1
              description: Current version of the record; incremented on every successful write.

    PutKeyParamsRequest:
      type: object
      required: [record, base_version, vault_proof]
      properties:
        record:
          $ref: "#/components/schemas/KeyParamsRecord"
        base_version:
          type: integer
          format: int64
          minimum: 1
          description: The `version` the client based its change on.
        vault_proof:
          $ref: "#/components/schemas/VaultProof"

    PutKeyParamsResponse:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
          description: Version after the write.

    Envelope:
      type: object
      description: The item envelope. The server can see only these fields; everything else is inside `sealed`.
      required: [v, id, created_at, updated_at, size, sealed]
      properties:
        v:
          type: integer
          minimum: 1
          description: Envelope version, currently 1; unknown versions are rejected.
        id:
          $ref: "#/components/schemas/Id"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          description: Must not be smaller than `created_at`.
        size:
          type: integer
          format: int64
          minimum: 0
          maximum: 8388608
          description: Must equal the byte length of the decoded `sealed`.
        blob_id:
          allOf:
            - $ref: "#/components/schemas/Id"
          description: Optional identifier of the associated blob.
        sealed:
          type: string
          contentEncoding: base64
          maxLength: 11184812
          description: base64 of `nonce(24) || ciphertext || tag(16)`, algorithm XChaCha20-Poly1305.

    ItemUpsert:
      type: object
      description: Create or update.
      required: [base_seq, envelope]
      properties:
        base_seq:
          type: integer
          format: int64
          minimum: 0
          description: The current `seq` of the item; 0 for a new item.
        envelope:
          $ref: "#/components/schemas/Envelope"

    ItemDelete:
      type: object
      description: Delete; carries no envelope.
      required: [base_seq, deleted]
      properties:
        base_seq:
          type: integer
          format: int64
          minimum: 0
          description: The current `seq` of the item.
        deleted:
          type: boolean
          const: true
          description: Always true.

    PutItemResponse:
      type: object
      required: [seq]
      properties:
        seq:
          type: integer
          format: int64
          minimum: 1
          description: The `seq` assigned to the item.

    ItemRecord:
      type: object
      required: [id, seq, deleted]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        seq:
          type: integer
          format: int64
          minimum: 1
          description: Sequence number assigned to the latest write of the item.
        deleted:
          type: boolean
          description: Whether the item is deleted.
        envelope:
          allOf:
            - $ref: "#/components/schemas/Envelope"
          description: Present only if the item is not deleted.

    ItemPage:
      type: object
      required: [items, next_after, has_more, head_seq]
      properties:
        items:
          type: array
          description: In ascending `seq` order.
          items:
            $ref: "#/components/schemas/ItemRecord"
        next_after:
          type: integer
          format: int64
          minimum: 0
          description: The `after` value for the next page request.
        has_more:
          type: boolean
          description: Whether more items follow.
        head_seq:
          type: integer
          format: int64
          minimum: 0
          description: The current global sequence number of the vault, 0 if nothing was ever written. A client that has already seen a larger `seq` knows the server was rolled back.

    ChangeEvent:
      type: object
      required: [seq]
      properties:
        seq:
          type: integer
          format: int64
          minimum: 0
          description: The current latest `seq`.
